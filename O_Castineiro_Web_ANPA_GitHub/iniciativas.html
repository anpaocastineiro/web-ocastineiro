<!doctype html><html lang="gl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquivo de iniciativas · O Castiñeiro</title><style>:root{--green:#0f3d32;--paper:#fff8ec;--cream:#f7efe2}*{box-sizing:border-box}body{margin:0;background:var(--cream) url('/assets/paper_noise.png');font-family:Arial;color:#2b2522}.container{width:min(1200px,calc(100% - 40px));margin:auto}header{background:var(--green);color:white;padding:20px}header a{color:white;font-weight:900;text-decoration:none}h1{font:900 clamp(39px,6vw,74px)/1 Georgia;color:var(--green);margin:45px 0 20px}p{line-height:1.55}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}.filters input,.filters select{padding:12px;border:2px solid var(--green);background:var(--paper);min-height:45px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid #657c6e;background:var(--paper);padding:22px;min-height:240px;display:flex;flex-direction:column}.card[data-state=conversa]{background:#f2e0e8}.card[data-state=seguimento]{background:#e3ede2}.card[data-state=resolta]{background:#e8e1d3}.card h2{font:900 29px/1.05 Georgia;color:var(--green)}.card p{font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.tag{background:var(--green);color:white;font-size:11px;font-weight:900;letter-spacing:.05em;align-self:flex-start;padding:8px}.card button,.pager button{border:2px solid var(--green);padding:9px 13px;background:var(--paper);color:var(--green);font-weight:900;cursor:pointer}.card button{margin-top:auto;align-self:flex-start}.pager{display:flex;justify-content:center;gap:16px;padding:30px}.pager button:disabled{opacity:.35}dialog{background:var(--paper);max-width:680px;width:calc(100% - 36px);max-height:80vh;overflow:auto;padding:26px;border:2px solid var(--green)}dialog p{white-space:pre-line}dialog::backdrop{background:#0a3027b8}@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.filters input,.filters select{width:100%}}</style></head><body><header><div class="container"><a href="/">← O Castiñeiro</a></div></header><main class="container"><h1>Arquivo de iniciativas.</h1><p>Consulta as propostas da comunidade, o seu estado e os avances. Os exemplos están identificados como ficticios.</p><div class="filters"><input id="buscar" type="search" placeholder="Buscar iniciativas..." aria-label="Buscar iniciativas"><select id="estado" aria-label="Filtrar por estado"><option value="todos">Todos os estados</option><option value="recollida">Recollidas</option><option value="conversa">En conversa</option><option value="seguimento">En seguimento</option><option value="resolta">Resoltas</option></select><select id="categoria" aria-label="Categoría"><option value="todas">Todas as categorías</option><option value="educacion">Educación</option><option value="convivencia">Convivencia</option><option value="espazos">Espazos</option><option value="comunidade">Comunidade</option><option value="outras">Outras</option></select></div><p id="contador">Cargando iniciativas…</p><div class="grid" id="grid"></div><div class="pager"><button id="prev">← Anterior</button><span id="num"></span><button id="next">Seguinte →</button></div></main><dialog id="dialog"><button id="close">Pechar ×</button><div id="detalle"></div></dialog><script>(()=>{'use strict';const $=s=>document.querySelector(s),labels={recollida:'RECOLLIDA',conversa:'EN CONVERSA',seguimento:'EN SEGUIMENTO',resolta:'RESOLTA'};let rows=[],page=1;const per=9;function txt(parent,tag,value){const n=document.createElement(tag);n.textContent=String(value||'');parent.append(n);return n}function detail(x){const root=$('#detalle');root.replaceChildren();txt(root,'h2',x.titulo);txt(root,'p',x.descripcion);if(x.detalle)txt(root,'p',x.detalle);if(x.resultado){txt(root,'h3','Resultado ou acordo');txt(root,'p',x.resultado)}if(Array.isArray(x.actualizacions))x.actualizacions.forEach(a=>{if(a.texto)txt(root,'p',(a.data||'')+' · '+a.texto)});if(x.exemplo)txt(root,'p','Exemplo ficticio.');$('#dialog').showModal()}function render(){const search=$('#buscar').value.trim().toLocaleLowerCase(),state=$('#estado').value,cat=$('#categoria').value;const found=rows.filter(x=>(state==='todos'||x.estado===state)&&(cat==='todas'||(x.categoria||'outras')===cat)&&[x.titulo,x.descripcion,x.detalle].some(v=>String(v||'').toLocaleLowerCase().includes(search)));page=Math.min(page,Math.max(1,Math.ceil(found.length/per)));const frag=document.createDocumentFragment();for(const x of found.slice((page-1)*per,page*per)){const card=document.createElement('article');card.className='card';card.dataset.state=x.estado;txt(card,'span',(x.exemplo?'EXEMPLO · ':'')+labels[x.estado]).className='tag';txt(card,'h2',x.titulo);txt(card,'p',x.descripcion);const btn=txt(card,'button','Ver iniciativa ↗');btn.type='button';btn.addEventListener('click',()=>detail(x));frag.append(card)}if(!found.length)txt(frag,'p','Non hai iniciativas que coincidan coa busca.');$('#grid').replaceChildren(frag);$('#contador').textContent=found.length+' iniciativas atopadas';$('#num').textContent='Páxina '+page+' de '+Math.max(1,Math.ceil(found.length/per));$('#prev').disabled=page<=1;$('#next').disabled=page*per>=found.length}for(const id of ['buscar','estado','categoria'])$('#'+id).addEventListener('input',()=>{page=1;render()});$('#prev').addEventListener('click',()=>{page--;render()});$('#next').addEventListener('click',()=>{page++;render()});$('#close').addEventListener('click',()=>$('#dialog').close());fetch('/content/ideas.json').then(r=>r.json()).then(d=>{rows=(d.items||[]).filter(x=>x.publicado===true&&labels[x.estado]);render()}).catch(()=>$('#contador').textContent='Non foi posible cargar as iniciativas.');})();</script></body></html>
