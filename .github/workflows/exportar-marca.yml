name: Exportar identidade O Castiñeiro para Canva
on:
  push:
    paths:
      - 'O_Castineiro_Web_ANPA_GitHub/scripts/export_canva_brand.py'
      - '.github/workflows/exportar-marca.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Exportar recursos PNG e ZIP
        run: python O_Castineiro_Web_ANPA_GitHub/scripts/export_canva_brand.py
      - name: Gardar paquete no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add O_Castineiro_Web_ANPA_GitHub/identidade-canva/
          if ! git diff --cached --quiet; then
            git commit -m "Engadir paquete de identidade PNG transparente para Canva"
            git push
          fi
